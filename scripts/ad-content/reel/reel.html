<!doctype html>
<!--
  The feature reel's compositor: one 1080 x 1920 frame, drawn from a plain
  description of where everything is at that instant. compose.mjs works out
  the description for each frame (camera, spotlight, circle, finger, caption,
  end card) and calls window.draw(frame), then takes the screenshot. Nothing
  here animates on its own, so every frame is exact and the motion is smooth
  however long a frame takes to draw.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070b14; }
      body { font-family: "Inter Display", Inter, system-ui, sans-serif; color: #fff; }
      #bg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 0%, #13213a 0%, #0a1120 55%, #060910 100%); }
      .glow { position: absolute; border-radius: 999px; filter: blur(120px); opacity: 0.55; }
      #g1 { width: 900px; height: 900px; background: #1d6b60; }
      #g2 { width: 700px; height: 700px; background: #7a4b0e; opacity: 0.35; }
      #grain { position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }

      /* The phone is a whole iPhone: a black bezel with a titanium edge, the
         status bar and the Dynamic Island, then the app. A zoom moves the whole
         device, so it runs off the edges of the frame rather than being cut by
         a window; the captions sit on a fade at the top. */
      #world { position: absolute; inset: 0; perspective: 2400px; }
      .phone { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; background: #05070b;
        box-shadow: 0 60px 140px rgb(0 0 0 / 0.65), 0 0 0 var(--edge) #4a4f58 inset, 0 0 0 calc(var(--edge) * 2) #23262c inset; }
      .phone .screen { position: absolute; overflow: hidden; }
      .phone img { position: absolute; display: block; left: 0; }
      .phone .bar { position: absolute; left: 0; top: 0; width: 100%; display: flex; align-items: center; justify-content: space-between;
        font: 600 var(--fs) Inter, system-ui, sans-serif; letter-spacing: -0.01em; color: #fff; }
      .phone .bar svg { height: 100%; width: auto; display: block; }
      .phone .island { position: absolute; left: 50%; background: #000; border-radius: 999px; transform: translateX(-50%); }
      .phone .sheen { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: linear-gradient(125deg, rgb(255 255 255 / 0.10) 0%, rgb(255 255 255 / 0) 35%); }
      /* Solid behind the caption, then gone by the device's top edge's first
         rows, so a zoomed app never shows through the words. */
      #scrim { position: absolute; left: 0; right: 0; top: 0; height: 610px; pointer-events: none;
        background: linear-gradient(180deg, rgb(8 13 24 / 0.98) 0%, rgb(8 13 24 / 0.95) 76%, rgb(8 13 24 / 0) 100%); }

      #fx { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #taps, #finger-clip { position: absolute; inset: 0; }
      #fx .rim { fill: none; stroke: #5ed6c1; stroke-width: 5; }
      #fx .circle { fill: none; stroke: #ffb020; stroke-width: 9; stroke-linecap: round; }

      #finger { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 999px;
        background: rgb(255 255 255 / 0.92); box-shadow: 0 10px 30px rgb(0 0 0 / 0.55), 0 0 0 4px rgb(10 16 28 / 0.45); }
      .ripple { position: absolute; border-radius: 999px; border: 7px solid #fff; box-shadow: 0 0 24px rgb(94 214 193 / 0.9); }

      #cap { position: absolute; left: 110px; right: 110px; top: 300px; text-align: center;
        font-weight: 900; font-size: 86px; line-height: 1.04; letter-spacing: -0.035em;
        text-shadow: 0 6px 30px rgb(0 0 0 / 0.55); }
      #cap .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
      #cap .em { background: linear-gradient(180deg, #ffd166 0%, #ff9f1c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      /* The pill over a run of captions: "Free" in the app's teal, "Headpin
         Pro" in the gold the captions light their words with. */
      #kicker { position: absolute; left: 50%; top: 290px; transform-origin: 50% 50%; padding: 12px 30px 11px; border-radius: 999px;
        font: 900 30px Inter, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; }
      #kicker.free { color: #5ed6c1; background: rgb(94 214 193 / 0.12); border: 2px solid rgb(94 214 193 / 0.55); box-shadow: 0 0 40px rgb(94 214 193 / 0.25); }
      #kicker.pro { color: #1d1203; background: linear-gradient(180deg, #ffd166 0%, #ff9f1c 100%); border: 2px solid #ffe3a3; box-shadow: 0 0 50px rgb(255 176 32 / 0.45); }

      #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }

      #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding-bottom: 380px; }
      #end img { width: 230px; height: 230px; border-radius: 56px; box-shadow: 0 30px 90px rgb(94 214 193 / 0.35); }
      #end .name { font-size: 140px; font-weight: 900; letter-spacing: -0.045em; line-height: 1; }
      #end .tag { font-size: 58px; font-weight: 800; letter-spacing: -0.02em; color: #e7eef8; }
      #end .tag em { font-style: normal; color: #ffb020; }
      #end .cta { margin-top: 20px; padding: 26px 64px; border-radius: 999px; background: #5ed6c1; color: #052019;
        font: 900 64px "Inter Display", Inter, sans-serif; letter-spacing: -0.02em; box-shadow: 0 0 80px rgb(94 214 193 / 0.55); }
      #end .note { font-size: 44px; font-weight: 700; color: rgb(255 255 255 / 0.85); letter-spacing: -0.01em; }
      #end .pro { margin-top: 6px; display: flex; align-items: center; gap: 18px; font: 700 36px Inter, sans-serif; color: #e7eef8; }
      #end .pro b { font: 900 26px Inter, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; padding: 10px 20px 9px; border-radius: 999px;
        color: #1d1203; background: linear-gradient(180deg, #ffd166 0%, #ff9f1c 100%); }
      #end .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 900px; margin-top: 10px; }
      #end .chip { font: 700 30px Inter, sans-serif; padding: 12px 24px; border-radius: 999px; background: rgb(255 255 255 / 0.07); color: #cfe0f2; border: 1px solid rgb(255 255 255 / 0.1); }
    </style>
  </head>
  <body>
    <div id="bg"><div class="glow" id="g1"></div><div class="glow" id="g2"></div></div>
    <div id="world"></div>
    <div id="scrim"></div>
    <svg id="fx" viewBox="0 0 1080 1920">
      <defs>
        <mask id="holes"><rect width="1080" height="1920" fill="white" /><g id="hole-g"></g></mask>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
      </defs>
      <rect id="dim" width="1080" height="1920" fill="#03060c" mask="url(#holes)" />
      <g id="rims" filter="url(#glow)"></g>
      <g id="circles"></g>
    </svg>
    <div id="taps"></div>
    <div id="finger-clip"><div id="finger"></div></div>
    <div id="kicker"></div>
    <div id="cap"></div>
    <div id="end">
      <img src="/icons/icon-512.png" alt="" />
      <div class="name">Headpin</div>
      <div class="tag">Bowl <em>smarter</em>.</div>
      <div class="cta">Free on the App Store</div>
      <div class="note">Unlimited games · No account · Works offline</div>
      <div class="pro"><b>Pro</b>One purchase. No subscription.</div>
    </div>
    <div id="grain"></div>
    <div id="flash"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const world = $("world");
      const phones = new Map();
      const loaded = new Map();

      // The status bar's right side: signal, Wi-Fi, battery, in a 78 x 13 box.
      const ICONS = `<svg viewBox="0 0 78 13" fill="#fff"><rect x="0" y="8" width="3.2" height="4.5" rx="1"/><rect x="4.7" y="6" width="3.2" height="6.5" rx="1"/><rect x="9.4" y="3.5" width="3.2" height="9" rx="1"/><rect x="14.1" y="1" width="3.2" height="11.5" rx="1"/><path d="M31 2.6a10 10 0 0 1 7 2.9l1.3-1.3A11.9 11.9 0 0 0 31 .7a11.9 11.9 0 0 0-8.3 3.5L24 5.5a10 10 0 0 1 7-2.9Zm0 3.7a6.3 6.3 0 0 1 4.4 1.8l1.3-1.3A8.1 8.1 0 0 0 31 4.4a8.1 8.1 0 0 0-5.7 2.4l1.3 1.3A6.3 6.3 0 0 1 31 6.3Zm0 3.7c.7 0 1.3.3 1.8.7L31 12.5l-1.8-1.8c.5-.4 1.1-.7 1.8-.7Z"/><rect x="50.5" y="0.5" width="24" height="12" rx="3.6" fill="none" stroke="#fff" stroke-opacity="0.4"/><rect x="52.5" y="2.5" width="16" height="8" rx="2"/><path d="M76 4.2v4.6a2.5 2.5 0 0 0 0-4.6Z" fill-opacity="0.45"/></svg>`;

      function phoneEl(key) {
        let p = phones.get(key);
        if (!p) {
          p = document.createElement("div");
          p.className = "phone";
          p.innerHTML = `<div class="screen"><div class="bar"><span>9:41</span>${ICONS}</div><img /><div class="island"></div></div><div class="sheen"></div>`;
          world.appendChild(p);
          phones.set(key, p);
        }
        return p;
      }

      // The status bar takes the colour of the app's top edge, read from the
      // frame itself, so it runs on as the app's own header does.
      const tops = new Map();
      const probe = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
      function topColour(img) {
        const src = img.dataset.src;
        if (!tops.has(src)) {
          probe.canvas.width = 1;
          probe.canvas.height = 1;
          probe.drawImage(img, 40, 1, 1, 1, 0, 0, 1, 1);
          const [r, g, b] = probe.getImageData(0, 0, 1, 1).data;
          tops.set(src, `rgb(${r} ${g} ${b})`);
        }
        return tops.get(src);
      }

      async function setSrc(img, src) {
        if (img.dataset.src === src) return;
        img.dataset.src = src;
        img.src = src;
        await img.decode().catch(() => {});
      }

      /** Draw one frame. Every field is optional; what is absent is hidden. */
      window.draw = async (f) => {
        const waits = [];
        // Background drift.
        $("g1").style.transform = `translate(${f.bg.g1[0]}px, ${f.bg.g1[1]}px)`;
        $("g2").style.transform = `translate(${f.bg.g2[0]}px, ${f.bg.g2[1]}px)`;

        // Phones.
        const live = new Set();
        // p.x, p.y is the top left of the app itself and p.s its scale; the
        // status bar and the bezel are drawn around it.
        const BAR = 50;
        const BEZEL = 13;
        const RADIUS = 54;
        for (const p of f.phones) {
          live.add(p.key);
          const el = phoneEl(p.key);
          const s = p.s;
          const w = 390 * s;
          const h = 844 * s;
          const bar = BAR * s;
          const bez = BEZEL * s;
          const W = w + bez * 2;
          const H = h + bar + bez * 2;
          el.style.display = "block";
          el.style.width = `${W}px`;
          el.style.height = `${H}px`;
          el.style.borderRadius = `${(RADIUS + BEZEL) * s}px`;
          el.style.setProperty("--edge", `${Math.max(1.5, 1.6 * s)}px`);
          el.style.setProperty("--fs", `${17 * s}px`);
          el.style.opacity = p.opacity;
          el.style.zIndex = p.z ?? 1;
          el.style.filter = p.blur ? `blur(${p.blur}px)` : "none";
          el.style.transform =
            `translate(${p.x - bez}px, ${p.y - bar - bez}px) translate(${W / 2}px, ${H / 2}px) ` +
            `rotateY(${p.rotY ?? 0}deg) rotateZ(${p.rotZ ?? 0}deg) scale(${p.scale ?? 1}) translate(${-W / 2}px, ${-H / 2}px)`;
          const screen = el.querySelector(".screen");
          Object.assign(screen.style, { left: `${bez}px`, top: `${bez}px`, width: `${w}px`, height: `${h + bar}px`, borderRadius: `${RADIUS * s}px` });
          const barEl = el.querySelector(".bar");
          Object.assign(barEl.style, { height: `${bar}px`, padding: `${16 * s}px ${30 * s}px ${14 * s}px ${48 * s}px` });
          Object.assign(el.querySelector(".island").style, { top: `${11 * s}px`, width: `${124 * s}px`, height: `${36 * s}px` });
          const img = el.querySelector("img");
          img.style.top = `${bar}px`;
          img.style.width = `${w}px`;
          img.style.height = `${h}px`;
          waits.push(setSrc(img, p.src).then(() => (screen.style.background = topColour(img))));
        }
        for (const [key, el] of phones) if (!live.has(key)) el.style.display = "none";

        // Spotlight: dim everything but the holes, with a lit rim on each.
        const s = f.spot;
        $("dim").setAttribute("opacity", s ? s.alpha : 0);
        $("hole-g").innerHTML = s ? s.holes.map((h) => `<rect x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="${h.r}" fill="black"/>`).join("") : "";
        $("rims").innerHTML = s ? s.holes.map((h) => `<rect class="rim" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="${h.r}" opacity="${s.rim}"/>`).join("") : "";

        // Hand-drawn circles, drawn on by their dash.
        $("circles").innerHTML = (f.circles ?? [])
          .map((c) => `<path class="circle" d="${c.d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - c.progress}" opacity="${c.opacity}"/>`)
          .join("");

        // Finger and tap ripples.
        const fg = $("finger");
        if (f.finger) {
          fg.style.display = "block";
          fg.style.left = `${f.finger.x}px`;
          fg.style.top = `${f.finger.y}px`;
          fg.style.opacity = f.finger.opacity;
          fg.style.transform = `scale(${f.finger.scale})`;
        } else fg.style.display = "none";
        $("taps").innerHTML = (f.ripples ?? [])
          .map((r) => `<div class="ripple" style="left:${r.x - r.size / 2}px;top:${r.y - r.size / 2}px;width:${r.size}px;height:${r.size}px;opacity:${r.opacity}"></div>`)
          .join("");

        // Caption, word by word.
        const cap = $("cap");
        const key = f.caption ? f.caption.key : "";
        if (cap.dataset.key !== key) {
          cap.dataset.key = key;
          cap.innerHTML = f.caption
            ? f.caption.words.map((w) => (w.br ? "<br>" : `<span class="w${w.em ? " em" : ""}">${w.text}</span>`)).join("")
            : "";
        }
        if (f.caption) {
          const spans = cap.querySelectorAll(".w");
          f.caption.words.filter((w) => !w.br).forEach((w, i) => {
            const el = spans[i];
            el.style.opacity = w.opacity;
            el.style.transform = `translateY(${w.dy}px) scale(${w.scale})`;
            el.style.filter = w.blur > 0.2 ? `blur(${w.blur}px)` : "none";
          });
          cap.style.top = `${f.caption.top ?? 300}px`;
          cap.style.fontSize = `${f.caption.size ?? 86}px`;
        }
        const kick = $("kicker");
        kick.textContent = f.kicker ? f.kicker.text : "";
        kick.className = f.kicker ? f.kicker.kind : "";
        kick.style.opacity = f.kicker ? f.kicker.opacity : 0;
        kick.style.transform = `translateX(-50%) scale(${f.kicker ? f.kicker.scale : 1})`;

        // End card.
        const end = $("end");
        const e = f.end;
        end.style.display = e ? "flex" : "none";
        if (e) {
          const kids = end.children;
          e.items.forEach((it, i) => {
            kids[i].style.opacity = it.opacity;
            kids[i].style.transform = `translateY(${it.dy}px) scale(${it.scale})`;
          });
        }
        $("flash").style.opacity = f.flash ?? 0;
        $("scrim").style.opacity = f.end ? 0 : 1;
        $("scrim").style.height = `${f.scrim ?? 610}px`;
        await Promise.all(waits);
      };
      window.ready = document.fonts.ready.then(() => $("end").querySelector("img").decode().catch(() => {}));
    </script>
  </body>
</html>
