name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR makes the older run moot; main is never
# cancelled, because every push there is a deploy and wants its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The gate is `npm run verify`, run as parallel jobs rather than one line of
# steps: the same commands, nothing skipped, so it is no weaker than the local
# `verify`, but the wall clock is the slowest job rather than the sum of them.
# It used to be one job of about 23 minutes, 18 of them end-to-end tests run
# one at a time, Chromium then WebKit.
jobs:
  checks:
    # Pinned: ubuntu-latest is Ubuntu 26.04 now, which Playwright 1.60 cannot install browsers on.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: pdfjs-dist 6 requires Node 22.13 or later, and the
          # pattern pipeline's tests draw real sheet pages with it (ADR-136).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The translation catalogs match the strings in the source (ADR-220).
      - name: Translation catalogs
        run: npm run i18n:check

      - name: Unit tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Build (typecheck + production bundle + PWA)
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # Every browser reports, so one red does not hide another.
      fail-fast: false
      matrix:
        include:
          # Both projects in playwright.config.ts, not just chromium. The
          # webkit project is the iPhone the launch crowd actually bowls with.
          # With the offline-boot project, which runs the production build
          # under a real service worker, so this job builds first.
          - name: chromium
            browser: chromium
            args: --project=chromium --project=offline-boot --grep-invert "text fit"
            build: true
          #
          # WebKit one test at a time, split over two runners instead. Two
          # WebKit workers beside the dev server starve a four-core runner:
          # tests ran two to three times slower than alone and the longest
          # ones (a whole game bowled) reached the 30s limit.
          - name: webkit 1/2
            browser: webkit
            args: --project=webkit --shard=1/2 --workers=1
          - name: webkit 2/2
            browser: webkit
            args: --project=webkit --shard=2/2 --workers=1
          # Eight languages, each a walk of every main screen, and one engine
          # is enough for font metrics (ADR-225). Its own job, the locales four
          # at a time: run in line it was five and a half minutes on its own.
          - name: text-fit
            browser: chromium
            args: --project=chromium e2e/text-fit.spec.ts --workers=4
            fonts: true
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The faces e2e/text-fit.spec.ts measures with: Inter for Latin text,
      # close to the phones' own, and Noto Sans CJK. Without them the runner
      # falls back to DejaVu Sans, far wider than any phone (ADR-225).
      - name: Install fonts for the text-fit check
        if: matrix.fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-inter fonts-noto-cjk

      - name: Build, for the offline-boot project
        if: matrix.build
        run: npm run build

      - name: End-to-end tests
        run: npx playwright test ${{ matrix.args }}
        env:
          E2E_BUILT: ${{ matrix.build && '1' || '' }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # The shot tracer's regression check (scripts/shot-tracker/regress.ts): the
  # tracer read on real videos, each reading held to its margin. A job of its
  # own, so it adds nothing to the wall clock beside checks and e2e, and it
  # exits green at once unless tracer code changed. It is not in `report`'s
  # needs, and Vercel never reads CI, so it cannot hold a deploy.
  shot-tracer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SHOT_RELEASE: shot-clips-v1
    steps:
      - uses: actions/checkout@v4

      # Did tracer code change? A PR is compared with its base, a push with
      # the commit before it. Where there is nothing to compare (a new
      # branch, a force push, a shallow miss) it runs, because skipping on a
      # guess is how a regression gets through.
      - name: Did the tracer change?
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths='^(src/lib/shotTrack/|src/shotTracer/|scripts/shot-tracker/|package-lock\.json$)'
          run=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git fetch --no-tags --depth=1 origin "$BASE"; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if printf '%s\n' "$changed" | grep -Eq "$paths"; then
              echo "Tracer files changed:"; printf '%s\n' "$changed" | grep -E "$paths"
            else
              run=false
              echo "No tracer files changed: nothing to check."
            fi
          else
            echo "No base to compare with: running the check."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then echo "Shot tracer check skipped: no tracer files changed." >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: npm ci

      # app-read.ts decodes the videos with ffmpeg.
      - name: Install ffmpeg
        if: steps.filter.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg unzip

      # Keyed on the release tag and the sha256 of every release video in the
      # manifest, so a new clip set is a new key and an old zip is never reused.
      - name: Key the clips cache
        if: steps.filter.outputs.run == 'true'
        id: key
        run: |
          key=$(node -e 'const m=require("./scripts/shot-tracker/regress/expected.json");const s=m.videos.filter(v=>v.sha256).map(v=>v.sha256).sort().join(",");console.log(m.release.tag+"-"+require("crypto").createHash("sha256").update(s).digest("hex").slice(0,16))')
          echo "key=shot-clips-$key" >> "$GITHUB_OUTPUT"

      - name: Cache the clips
        if: steps.filter.outputs.run == 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: .shot-clips-cache
          key: ${{ steps.key.outputs.key }}

      # The release holds the videos too big or too private for the repo.
      # Without it (the first run, a fork) the repo's own clips are still read.
      - name: Fetch the clips release
        if: steps.filter.outputs.run == 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$SHOT_RELEASE" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release download "$SHOT_RELEASE" --repo "${{ github.repository }}" --pattern "$SHOT_RELEASE.zip" --dir .shot-clips-cache
          else
            echo "::warning::Release $SHOT_RELEASE is missing: the shot tracer check reads only the clips in the repo."
          fi

      - name: Check the shot tracer
        if: steps.filter.outputs.run == 'true'
        run: |
          zip=".shot-clips-cache/$SHOT_RELEASE.zip"
          if [ -f "$zip" ]; then
            mkdir -p .shot-clips
            unzip -o -q "$zip" -d .shot-clips
            export SHOT_CLIPS_DIR="$PWD/.shot-clips" SHOT_CLIPS_REQUIRED=1
          else
            echo "::notice::Release $SHOT_RELEASE is missing, so only the repo clips are checked and the release clips are skipped."
          fi
          start=$SECONDS
          # The shell runs with -e, so keep the status to print the time first.
          status=0
          npx tsx scripts/shot-tracker/regress.ts || status=$?
          echo "Shot tracer check took $((SECONDS - start)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  # A red run on `main` is a shipped-broken production build, because
  # Vercel deploys the push regardless of this workflow. Four such runs
  # once went unnoticed for a day, so a failure files an issue rather than
  # waiting to be looked at.
  report:
    needs: [checks, e2e]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open an issue when main is red
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const title = `CI is red on main (${sha})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci-failure"
            });
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              "",
              "Vercel has already deployed this commit to production. Fix forward or roll back.",
            ].join("\n");
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still red at ${sha}.\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ci-failure"]
              });
            }
