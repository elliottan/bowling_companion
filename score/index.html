<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#fff8ed" />
    <!--
      Google reads the favicon off this link, not off the manifest, and shows it
      beside the result. Both sides are a multiple of 48 because that is what it
      asks for; a tab would be happy with 32.
    -->
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- iOS composites alpha onto black and wants 180x180, so it gets its own
         opaque file rather than the maskable-safe 192. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Headpin" />

    <title>Headpin</title>
    <!--
      This shell answers two addresses: /app, the free web app, and /score, the
      owner's copy with every feature (ADR-154). The build links the free app's
      manifest, so a visitor installs a home screen app that opens /app. The
      owner's copy swaps in its own, which opens /score, so adding it to a home
      screen keeps it the owner's. The link is injected after this script runs,
      hence the wait for the document.
    -->
    <script>
      (function () {
        if (!/^\/score(\/|$)/.test(location.pathname)) return;
        document.addEventListener("DOMContentLoaded", function () {
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.setAttribute("href", "/manifest-owner.webmanifest");
        });
      })();
    </script>
    <!--
      The app shell is deliberately not indexed. It serves an empty #root, so
      the only thing a crawler could rank it on is the boilerplate here, and it
      would compete with the landing page at / for the same query. One page
      answers a search; this one answers a tap.
    -->
    <meta name="robots" content="noindex" />

    <!--
      Resolve the theme before first paint so there is no light-mode flash.
      Stored 'theme' ('light'|'dark') wins; otherwise follow the OS. When no
      preference is stored we also track OS changes live. Also keeps the
      browser/standalone chrome color (theme-color) in sync with the shell.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        function apply(dark) {
          root.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0f172a" : "#fff8ed");
        }
        function stored() {
          try {
            return localStorage.getItem("theme");
          } catch (e) {
            return null;
          }
        }
        function resolve(osDark) {
          var pinned = stored();
          apply(pinned ? pinned === "dark" : osDark);
        }
        // The accent palette (Pro), set before first paint like the theme. The
        // app takes it back off if Pro is not open once it has started.
        try {
          var palette = localStorage.getItem("palette");
          if (palette && /^[a-z]+$/.test(palette)) root.dataset.palette = palette;
        } catch (e) {}
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        resolve(mq.matches);
        // Re-reads storage on every fire rather than being attached
        // conditionally: the preference can be pinned later in the session, and
        // a listener bound to the load-time value would keep overriding it.
        mq.addEventListener("change", function (e) { resolve(e.matches); });
      })();
    </script>
    <!--
      Page counts only (Vercel Web Analytics): views, referrers, rough country.
      No cookies and no identifier stored in the browser, which is why /legal
      needs no consent banner and does not carry this itself. It fails silently
      when offline, which is most of the time for an installed app.
    -->
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
